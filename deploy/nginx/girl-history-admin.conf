# ─────────────────────────────────────────────────────────────────────────────
# Статика админки girl-history-admin.
#
# Блок ADDITIVE: добавляется в СУЩЕСТВУЮЩИЙ server-блок того же домена, где уже
# живут админка Lisa AI (корень домена) и API girl-history (/girl-history/).
# Соседние проекты не трогаем.
#
# Установка:
#   1. вставить содержимое в server-блок нужного домена
#      (или подключить через include, если конфиг разбит на части);
#   2. nginx -t
#   3. systemctl reload nginx
#
# Проверить после установки:
#   curl -I https://<домен>/girl-history-admin/          → 200
#   curl -I https://<домен>/                             → по-прежнему Lisa AI
# ─────────────────────────────────────────────────────────────────────────────

# Оболочка приложения и всё, что не нашлось на диске.
#
# `root`, а НЕ `alias`: при root путь /girl-history-admin/x ложится на
# /var/www/girl-history-admin/x сам, потому что имя папки совпадает с префиксом URL.
# Связка alias + try_files — известная ловушка nginx: $uri внутри try_files
# раскрывается не так, как ожидается, и SPA-фолбэк ведёт себя непредсказуемо.
#
# Отсюда требование: папка на диске ОБЯЗАНА называться girl-history-admin.
location /girl-history-admin/ {
    root /var/www;

    # SPA-фолбэк: без него прямое открытие или F5 на внутреннем состоянии даст 404.
    try_files $uri $uri/ /girl-history-admin/index.html;
}

# Ассеты Vite содержат хеш в имени и потому неизменяемы — кешируем надолго.
# try_files здесь не нужен: отсутствующий ассет должен честно давать 404,
# а не возвращать HTML оболочки вместо JS.
location /girl-history-admin/assets/ {
    root /var/www;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# index.html кешировать НЕЛЬЗЯ.
#
# Имя у оболочки постоянное, а ссылки внутри — на хешированные ассеты. Если её
# закешировать, то после следующего выката вернувшийся посетитель потянет файлы,
# которых на диске уже нет, и увидит белый экран до hard-reload.
# Ассеты — immutable на год, оболочка — всегда свежая.
location = /girl-history-admin/index.html {
    root /var/www;
    add_header Cache-Control "no-cache";
}
